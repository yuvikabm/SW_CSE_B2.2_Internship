<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS colors</title>
    <style>
        .named{
            color: blue;
        }
        .hex{
            /* 0-f:rd green blue*/
            color: #ff0023;
        }
        .rgb{
            /*Color value: 0-255 a(transperancy): 0-1*/
            color: rgb(130, 58, 196,1);
        }
        .hsl{
            /*hsla: Hue(0-360|0=red,120=green,240=blue),
            Saturation(0-100%) vivid, Lightness(0-100%) light/dark,Trasperancy(0-1) */
            color: hsla(138, 100%, 50%, 0.6);
        }
        .gradient{
            /*Linear | Radial| Conic*/
            background-image: linear-gradient(135deg,red,blue);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;
        }
    </style>
</head>
<body>
    <p>CSS colors</p>
    <ol>
        <li class="named">Named colors</li>
        <li class="hex">HEX colors</li>
        <li class="rgb">RGB & RGBA</li>
        <li class="hsl">HSL & HSLA</li>
        <li class="gradient">Gradient color</li>
    </ol>
</body>
</html>
