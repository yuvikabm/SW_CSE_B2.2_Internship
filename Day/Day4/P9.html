<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors |Type selector/Element selector</title>
    <style>
        .Style1{
            font-size: 18px;
            background-color: blueviolet;
            color: blanchedalmond;
        }
        .Style2{
            color: brown;
        }
        .Style3{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 class="Style1">Class selector</h1>
    <h1v class="Style2">Heading tag itself: but different style</h1>
    <p class="Style3">This is a new paragraph that I've created.</p>
    <p class="Style2">This is second paragraph</p>
</body>
</html>
