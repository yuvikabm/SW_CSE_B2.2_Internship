<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors | Id selector</title>
    <style>
        #first-heading{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: cadetblue;
        }
        #first-paragraph{
            background-color:beige;
            color:yellowgreen;
        }
        #sub-paragraph{
            background-color: aqua;
            color: burlywood;
        }
    </style>
</head>
<body>
    <h1 id="first-heading">India</h1>
    <p id="first-paragraph">India, officially the Republic of India,[j][19] is a country in South Asia. It is the world's seventh-largest country by area and the largest by population.</p>
    <p id="sub-paragraph"> In the Indian Ocean, India is near Sri Lanka and the Maldives.</p>
</body>
</html>
