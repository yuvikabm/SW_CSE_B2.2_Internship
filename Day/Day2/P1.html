<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag</title>
</head>
<body>
    <!-- Image tag: -->
     <img src="dogimage.jpg" alt="The image of a dog">
     <!-- src: source | alt: alternative -->
      <!-- Image type: jpg/jpeg | png | webp | gif -->
    <img src="dogimage.jpg" alt="The image of a dog" width="400px" height="250px">
    <!--Title- tooltip text-->
    <img src="dogimage.jpg" alt="The image of a dog" title="My name is Tommy.">
    <!--Relative image -->
    <img src="/SW_CSE_B2.2_Internship/Day/Images/dog.jpg" alt="The image of a dog" title="My name is Tommy.">
