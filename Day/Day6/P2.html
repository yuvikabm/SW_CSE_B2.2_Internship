<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box{
            width: 200px;
            height: 100px;
            background-color: chartreuse;
            /* top-right-bottom-left | top-bottom & left-right */
            padding: 20px; /*Shorthand representation*/

            /* border*/
            /* Shorthand representation*/
            /* border: 2px solid brown;*/
            /* Line display style: solid/dashed/dotted */
            border-left: 1px dotted brown;

            /* Margin:shorthand*/
            margin: 20px;

            /* margin individual*/
            margin-top: 10px;
            margin-right: 20px;
            margin-bottom: 12px;
            margin-left: 500px ;
        }
    </style>
</head>
<body>
    <div class="box">
        Content Text is being rendered here as an example for box model.
    </div>
</body>
</html>
